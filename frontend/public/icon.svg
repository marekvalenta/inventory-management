<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Golden Amber Accent Gradients -->
    <linearGradient id="amberPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8AD4C" />
      <stop offset="100%" stop-color="#D49533" />
    </linearGradient>

    <linearGradient id="amberDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49533" />
      <stop offset="100%" stop-color="#B07824" />
    </linearGradient>
  </defs>

  <!-- Maximized Isometric Container Icon -->
  <g transform="translate(256, 232) scale(1.7)">
    <!-- Top Box Face (Golden Amber Highlight) -->
    <path d="M 0 -90 L 80 -45 L 0 0 L -80 -45 Z" fill="url(#amberPrimary)" />
    
    <!-- Left Box Face (Warm Mid-Tone) -->
    <path d="M -80 -45 L 0 0 L 0 90 L -80 45 Z" fill="#D49533" opacity="0.9" />

    <!-- Right Box Face (Deep Shadow) -->
    <path d="M 0 0 L 80 -45 L 80 45 L 0 90 Z" fill="url(#amberDark)" />

    <!-- Secondary Stack Base -->
    <path d="M -80 65 L 0 110 L 80 65" fill="none" stroke="#E8AD4C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -80 85 L 0 130 L 80 85" fill="none" stroke="#D49533" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
